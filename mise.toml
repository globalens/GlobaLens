# GlobaLens 3.0 toolchain and tasks. Versions and reasons: docs/adr/0001-monorepo-and-toolchain.md.
# mise installs these tools under its own directory (~/.local/share/mise) the first time a task runs;
# nothing is installed system-wide.

min_version = "2025.4.0"

# Python is not listed: uv installs it and pyproject.toml pins it (requires-python).
[tools]
node = "26.13.0"
"npm:pnpm" = "12.18.0"
uv = "0.13.7"
opentofu = "1.13.9"
dbmate = "2.37.0"
age = "1.3.2"
conftest = "0.71.1"

[tasks.install]
description = "Install JavaScript and Python dependencies exactly as locked"
run = ["pnpm install --frozen-lockfile", "uv sync --locked"]

[tasks.check]
description = "Lint, types and unit tests. The Stop hook and CI run this."
depends = ["install"]
run = "pnpm exec turbo run lint typecheck test"

[tasks.test]
description = "Every test suite: the unit tests, then the SQL tests and the ledger's tests, which need Docker."
depends = ["install"]
run = [
  "pnpm exec turbo run test",
  "uv run --no-sync pytest db/tests/pg",
  "uv run --no-sync pytest apps/worker/tests/pg",
]

[tasks."test:db"]
description = "The SQL tests alone: db/migrations applied to a clean PostgreSQL 18 in a throwaway container."
depends = ["install"]
run = "uv run --no-sync pytest db/tests/pg"

[tasks."test:ledger"]
description = "The ledger's tests alone, against PostgreSQL 18 in a throwaway container: the fence, the tier-1 walk, the poller, and the 1,000-history property test."
depends = ["install"]
run = "uv run --no-sync pytest apps/worker/tests/pg"

[tasks.dev]
description = "Start the local stack. Nothing to start yet: each app's dev script arrives with the app."
depends = ["install"]
run = "pnpm exec turbo run dev"

[tasks.e2e]
description = "End-to-end tests. None yet: Playwright arrives with the P1 deploy task."
depends = ["install"]
run = "pnpm exec turbo run e2e"

[tasks."bench:smoke"]
description = "Placeholder benchmark that proves the bench:<name> wiring. Add one task per file in bench/."
depends = ["install"]
run = "uv run --no-sync python bench/smoke.py"

[tasks."bench:parse"]
description = "GKG parse throughput on one core. Pass real GKG files or folders after --; without them it runs on synthetic rows."
depends = ["install"]
run = "uv run --no-sync python bench/parse_bench.py"

[tasks."tofu:validate"]
description = "fmt -check, init -backend=false and validate for every stack under infra/live. Needs no credentials, but downloads the providers each stack's lock file pins, so it is not part of check."
run = """
#!/usr/bin/env bash
set -euo pipefail
for dir in infra/live/*/; do
  stack=${dir%/}
  if ! compgen -G "${stack}/*.tf" > /dev/null; then
    echo "skip ${stack} (no .tf files yet)"
    continue
  fi
  echo "== ${stack}"
  tofu -chdir="${stack}" fmt -check -diff
  tofu -chdir="${stack}" init -input=false -backend=false -lockfile=readonly > /dev/null
  tofu -chdir="${stack}" validate
done
"""

[tasks."tofu:plan"]
description = "Read-only plan of every stack under infra/live, each checked by infra/policy/check-plan.sh. Never applies. Needs read-only credentials and the escrowed passphrase (infra/live/bootstrap/README.md)."
run = """
#!/usr/bin/env bash
set -euo pipefail
# (mise renders this script as a template first, so it must not contain an opening brace
# followed by a hash sign.)
missing=""
for name in CLOUDFLARE_API_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_cloudflare_account_id TF_VAR_state_passphrase; do
  if [ -z "${!name:-}" ]; then missing="${missing} ${name}"; fi
done
if [ -n "${missing}" ]; then
  echo "tofu:plan needs${missing} (infra/live/bootstrap/README.md)" >&2
  exit 1
fi
plans=$(mktemp -d)
trap 'rm -rf "${plans}"' EXIT
for dir in infra/live/*/; do
  stack=${dir%/}
  if ! compgen -G "${stack}/*.tf" > /dev/null; then
    echo "skip ${stack} (no .tf files yet)"
    continue
  fi
  echo "== ${stack}"
  tofu -chdir="${stack}" init -input=false -lockfile=readonly > /dev/null
  tofu -chdir="${stack}" plan -input=false -lock=false -out="${plans}/plan"
  tofu -chdir="${stack}" show -json "${plans}/plan" | sh infra/policy/check-plan.sh "${stack}"
  rm -f "${plans}/plan"
done
"""
