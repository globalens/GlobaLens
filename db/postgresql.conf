# PostgreSQL 18 on a GlobaLens node: the server image's whole configuration (db/Dockerfile).
#
# Sized for configuration S, where Postgres has a 1.2 GB memory limit on a 4 GB node
# (docs/design/p1.md §4; plan §9, resource budget). The values are design values, not
# measurements; the Phase 1 soak is where they meet real load. Settings not named here keep
# PostgreSQL's built-in defaults. pg_hba.conf stays in the data directory, where the image's
# entrypoint writes it: password (SCRAM) logins over the Compose network, nothing else.

# Connections. Only the Compose network can reach the server: no port is published, and the
# node's firewall denies all inbound traffic.
listen_addresses = '*'
port = 5432
max_connections = 20            # poller, two workers, publisher, guard, migration, readonly
password_encryption = scram-sha-256

# Memory, inside the 1.2 GB limit: shared buffers, plus work_mem per sort or hash, plus
# maintenance and autovacuum memory, plus each backend's own few MB.
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
autovacuum_work_mem = 32MB
dynamic_shared_memory_type = posix    # in the container's /dev/shm (Compose shm_size)
huge_pages = off

# Write-ahead log: the defaults, with a bound on how much is kept between checkpoints.
max_wal_size = 1GB
min_wal_size = 80MB

# Time is UTC everywhere, like every stamp in the ledger.
timezone = 'UTC'
log_timezone = 'UTC'

# Logs go to the container's stderr. No statement text is logged unless it is slow or fails,
# and the migration step turns that off while it sets passwords (db/migrate.sh).
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000ms
log_lock_waits = on
log_checkpoints = on
